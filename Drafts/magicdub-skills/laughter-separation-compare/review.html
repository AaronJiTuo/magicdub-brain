<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MagicDub · 现场声保留对比</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18352d;background:#f4f5ef}body{max-width:1050px;margin:36px auto;padding:0 22px}h1{font-size:28px;margin-bottom:8px}p{line-height:1.7;color:#54635c}section{background:white;border:1px solid #dfe5dd;border-radius:16px;padding:22px;margin:18px 0}button,select{font:inherit;border:1px solid #cad7ce;border-radius:9px;padding:10px 15px;background:#fff;color:inherit;cursor:pointer;margin:4px}button.active{background:#245e49;color:white}button:hover{border-color:#245e49}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}audio{width:100%;margin-top:16px}.hint{font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #e6eae3}#state{font-size:14px;color:#73786e}.badge{font-size:12px;background:#e4ecdf;padding:4px 9px;border-radius:12px}li{line-height:1.8;font-size:14px}.scroll{overflow:auto}
</style>
<h1>保留演讲中的笑声与现场氛围</h1><p>同一段乔布斯原音 · Demucs / SAM 时间段方案 / SAM 文字基线 <span class="badge">试验对比，尚未设为默认</span></p>
<section id="findings"></section>
<section><div class="row"><strong>先选听什么</strong><select id="kind">
<option value="background">背景：原音减去提取人声</option><option value="target">提取出来的人声</option>
<option value="dub">中文配音＋相减背景</option><option value="residual">SAM 直接输出的背景</option>
<option value="residual_dub">中文配音＋SAM 直接背景</option><option value="keep">背景＋局部原音保留示范</option>
<option value="dub_keep">中文配音＋局部原音保留示范</option></select></div>
<div id="versions" class="row" style="margin-top:12px"></div><p id="playing"></p>
<audio id="player" preload="metadata"></audio><div class="row"><button id="toggle">播放</button><span id="clock">0:00 / 1:00</span><label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label></div><input id="seek" aria-label="试听进度" type="range" min="0" max="60" step="0.05" value="0" style="width:100%;margin:12px 0"><div id="jumps" class="row"></div>
<label class="hint"><input id="loop" type="checkbox">循环所选片段</label><p id="state">读取对比结果…</p>
<p class="hint">切换模型时保持播放位置与音量。“原音”随时可作参照。重点听笑声是否消失、英文是否残留，以及左右空间感是否改变。</p></section>
<section><strong>费用与实际运行</strong><div class="scroll"><table><thead><tr><th>模型</th><th>音频时长</th><th>推理耗时</th><th>计费单位 × 数量</th><th>人民币</th><th>依据</th></tr></thead><tbody id="costs"></tbody></table></div><p id="total" class="hint"></p></section>
<section><strong>输出格式与试验边界</strong><p id="formats"></p><ul id="notes"></ul><p class="hint">网页播放使用 48 kHz 双声道 24 位 FLAC，另保留浮点 WAV 混音与模型原始输出。原生单声道复制为左右声道用于同一混音比较，并不意味着恢复了立体声。</p></section>
<script>
let data,current='original',range=null;const audio=document.querySelector('#player'),kind=document.querySelector('#kind');
function select(key){let t=data.tracks.find(t=>t.key===key);if(!t)return;let position=audio.currentTime||0,playing=!audio.paused;current=key;audio.src=t.url;audio.onloadedmetadata=()=>{audio.currentTime=Math.min(position,59.99);if(playing)audio.play().catch(()=>{});};document.querySelector('#playing').textContent=t.label;buttons();}
function buttons(){const v=document.querySelector('#versions');v.replaceChildren();for(const [key,label] of [['original','原音'],...Object.entries(data.model_labels)]){let id=key==='original'?key:key+'_'+kind.value;const b=document.createElement('button');b.textContent=label;b.classList.toggle('active',id===current);b.disabled=!data.tracks.some(t=>t.key===id);b.onclick=()=>select(id);v.appendChild(b);}}
kind.onchange=()=>{const model=current==='original'?'demucs':current.split('_')[0];let key=model+'_'+kind.value;if(!data.tracks.some(t=>t.key===key))key='sam1_'+kind.value;select(key)};
const toggle=document.querySelector('#toggle'),seek=document.querySelector('#seek');toggle.onclick=()=>{if(audio.paused)audio.play().catch(e=>document.querySelector('#state').textContent=e.message);else audio.pause();};audio.onplay=()=>toggle.textContent='暂停';audio.onpause=()=>toggle.textContent='播放';seek.oninput=()=>audio.currentTime=Number(seek.value);document.querySelector('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.ontimeupdate=()=>{if(range&&document.querySelector('#loop').checked&&audio.currentTime>=range.end)audio.currentTime=range.start;seek.value=audio.currentTime;document.querySelector('#clock').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / 1:00`;};
fetch('data.json').then(r=>r.json()).then(d=>{data=d;buttons();select('original');for(let w of d.windows){let b=document.createElement('button');b.textContent=`${w.name} ${w.start}–${w.end}s`;b.onclick=()=>{range=w;audio.currentTime=w.start;audio.play().catch(()=>{});};document.querySelector('#jumps').appendChild(b);}
document.querySelector('#state').textContent=`${d.tracks.length} 份试听音频完整解码通过 · 全部使用相同增益 ${d.common_gain.toFixed(3)}`;
document.querySelector('#formats').textContent=Object.entries(d.native_outputs).map(([k,v])=>`${k}: ${v.sample_rate} Hz / ${v.channels} 声道 / ${v.subtype}`).join('；');
const f=document.querySelector('#findings');let heading=document.createElement('strong');heading.textContent='先看这次实测发现';f.appendChild(heading);for(const [key,q] of Object.entries(d.quality_findings)){if(q.target_near_silent_on_transcribed_speech){let p=document.createElement('p');p.textContent=`${d.model_labels[key]}：讲话参考区提取结果比原音低 ${Math.abs(q.speech_reference_target_relative_db).toFixed(1)} dB，背景仍接近原英文。此组未通过有效分离检查，不可把背景声音更大当作保留效果更好。`;f.appendChild(p);}}
if(d.measurements.demucs_background){let p=document.createElement('p');const w=d.measurements.demucs_background.windows;p.textContent=`Demucs：讲话参考区降低 ${Math.abs(w['讲话参考'].rms_relative_original_db).toFixed(1)} dB，观众反应候选短窗也降低 ${Math.abs(w['观众反应候选短窗'].rms_relative_original_db).toFixed(1)} dB。`;f.appendChild(p);}if(d.measurements.pcm24_background){let p=document.createElement('p');p.textContent=`SAM PCM24 补测：提取信号恢复，但相减背景的讲话参考区只降低 ${Math.abs(d.measurements.pcm24_background.windows['讲话参考'].rms_relative_original_db).toFixed(1)} dB，尚不能直接替代 Demucs。只改输入编码的一次补测提示兼容性问题，尚未经过重复验证。`;f.appendChild(p);}
for(let n of d.limitations){let li=document.createElement('li');li.textContent=n;document.querySelector('#notes').appendChild(li);}
if(d.costs){for(let r of d.costs.rows){const tr=document.createElement('tr');for(const value of [d.model_labels[r.name]??r.name,`${r.audio_duration_seconds}s`,r.inference_time_seconds===null?'待核实':`${r.inference_time_seconds.toFixed(3)}s`,`${r.billing_unit} × ${r.billed_quantity??'未知'}`,r.cost_cny===null?'待核实':`¥${Number(r.cost_cny).toFixed(6)}`,r.cost_status==='confirmed'?'账单确认':'估算（计费量/标价）']){const td=document.createElement('td');td.textContent=value;tr.appendChild(td);}document.querySelector('#costs').appendChild(tr);}document.querySelector('#total').textContent=`本次费用估算合计 ¥${Number(d.costs.known_total_cny).toFixed(6)}，已包含效果不合格的试验。金额未知的请求 ${d.costs.unknown_attempts}。美元固定乘以 7；当前未取得账单读取权限，尚未完成对账。`;}}).catch(e=>{document.querySelector('#state').textContent='未能读取对比文件：'+e.message});
</script></html>
